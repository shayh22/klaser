<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

     servers and cannot resolve a relative path -->

<meta property="og:image:width" content="1200">

<meta property="og:image:alt" content="קלסר — עושים סדר בבירוקרטיה">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">

<style>
  :root{
    --bg:#f1f6f5;
    --bg2:#e3eeec;
    --card:#ffffff;
    --card-soft:#f7fbfa;
    --ink:#12211f;
    --ink-soft:#4a5f5c;
    --ink-faint:#5f716e;   /* 4.7:1 on the page bg — was #7d908d at 3.1:1 */
    --line:#dbe8e5;
    --brand:#0f766e;
    --brand-ink:#0b5952;
    --brand-soft:#dcf2ee;
    --warn:#b45309;
    --warn-soft:#fef3c7;
    --danger:#b91c1c;
    --danger-soft:#fee2e2;
    --good:#15803d;
    --good-soft:#dcfce7;
    --info:#1d4ed8;
    --info-soft:#dbeafe;
    --shadow:0 10px 30px rgba(10,60,55,.10);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1817;
      --bg2:#132322;
      --card:#172523;
      --card-soft:#1d2e2c;
      --ink:#eaf4f2;
      --ink-soft:#b0c6c2;
      --ink-faint:#7f9793;
      --line:#2a3d3a;
      --brand:#5eead4;
      --brand-ink:#99f6e4;
      --brand-soft:#173f3a;
      --warn:#fbbf24;
      --warn-soft:#3d2f11;
      --danger:#fca5a5;
      --danger-soft:#3f1a1a;
      --good:#86efac;
      --good-soft:#12331f;
      --info:#93c5fd;
      --info-soft:#152a4d;
      --shadow:0 10px 30px rgba(0,0,0,.4);
    }
  }
  :where(button,a[href],input,select,textarea,[tabindex]):focus-visible{
    outline:3px solid var(--brand);outline-offset:2px;border-radius:8px;
  }
  [hidden]{display:none!important}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Heebo","Assistant","Rubik",system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew",Arial,sans-serif;
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--ink);
    line-height:1.55;
    -webkit-text-size-adjust:100%;
    padding:0 0 48px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 14px}

  /* ---------- header ---------- */
  header.top{padding:22px 0 12px;text-align:center}
  header.top h1{margin:0;font-size:clamp(24px,5.5vw,34px);letter-spacing:-.5px}
  /* the heading is only visually replaced once the video is actually playing,
     so a blocked autoplay, a slow link or a missing codec never leaves the
     page without a title */
  header.top h1.replaced{
    position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;
  }
  .hero{
    max-width:520px;margin:0 auto 10px;border-radius:16px;overflow:hidden;
    background:var(--card-soft);border:1px solid var(--line);
    aspect-ratio:16/9;   /* known from the file: 1280x720, so no layout shift */
  }
  .hero{position:relative}
  .hero video{display:block;width:100%;height:100%;object-fit:cover}
  .hero-play{
    position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;
    border:none;cursor:pointer;font-size:24px;line-height:1;
    background:rgba(15,118,110,.92);color:#fff;
    display:grid;place-items:center;padding:0 0 0 4px;
    box-shadow:0 6px 20px rgba(0,0,0,.3);transition:transform .12s ease;
  }
  .hero-play:hover{transform:scale(1.06)}
  .hero-play:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
  header.top .sub{margin:2px 0 0;color:var(--ink-soft);font-size:14.5px}
  .langbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 0}
  @media (max-width:520px){
    .langbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr))}
    .langbar button{padding:0 6px;font-size:13px}
  }
  .langbar button{
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);
    border-radius:999px;padding:0 16px;min-height:44px;transition:.12s;
  }
  .langbar button:hover{border-color:var(--brand)}
  .langbar button[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

  /* ---------- tabs ---------- */
  nav.tabs{display:flex;gap:6px;margin:16px 0 14px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:5px;box-shadow:var(--shadow)}
  nav.tabs button{
    flex:1;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;padding:6px;
    min-height:48px;border:none;background:transparent;color:var(--ink-soft);
    border-radius:10px;transition:.12s;
  }
  nav.tabs button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand-ink)}
  nav.tabs button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

  /* ---------- generic card ---------- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 15px;margin-bottom:12px;
  }

  /* Hebrew term chip — always visible, whatever the UI language */
  .he-term{
    display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap;
    background:var(--brand-soft);color:var(--brand-ink);
    border-radius:8px;padding:2px 8px;font-size:12.5px;font-weight:600;
    direction:rtl;unicode-bidi:isolate;
  }
  .he-term .tr{font-size:11px;font-weight:500;opacity:.75;direction:ltr;unicode-bidi:isolate}

  /* ---------- toolbar / stats ---------- */
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .btn{
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:11px;padding:10px 15px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink);transition:.12s;
  }
  .btn:hover{border-color:var(--brand)}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  @media (prefers-color-scheme: dark){ .btn.primary{color:#08201d} }
  .btn{min-height:48px}
  .btn.small{font-size:13px;padding:0 13px;min-height:44px;border-radius:9px}
  @media (max-width:520px){ .toolbar .btn{width:100%} }
  .btn.danger{color:var(--danger);border-color:var(--danger-soft)}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 8px;text-align:center}
  .stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12.5px;color:var(--ink-soft);line-height:1.35;display:block}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .filters button{
    font:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:999px;
    padding:0 14px;min-height:44px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);transition:.12s;
  }
  .filters button[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

  /* ---------- case card ---------- */
  .case{padding:0;overflow:hidden}
  .case-head{display:flex;align-items:flex-start;gap:10px;padding:14px 15px;cursor:pointer;width:100%;
    background:transparent;border:none;font:inherit;color:inherit;text-align:start}
  .case-head:hover{background:var(--card-soft)}
  .case-main{flex:1;min-width:0}
  .case-title{display:block;font-size:16px;font-weight:700;margin:0 0 3px;word-break:break-word}
  .case-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-faint)}
  .case-caret{flex:0 0 auto;color:var(--ink-faint);font-size:13px;transition:transform .15s}
  .case[open-state="1"] .case-caret{transform:rotate(90deg)}
  html[dir="rtl"] .case[open-state="1"] .case-caret{transform:rotate(-90deg)}

  .badge{display:inline-block;border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .badge.todo{background:var(--line);color:var(--ink-soft)}
  .badge.collecting{background:var(--info-soft);color:var(--info)}
  .badge.submitted{background:var(--brand-soft);color:var(--brand-ink)}
  .badge.waiting{background:var(--warn-soft);color:var(--warn)}
  .badge.problem{background:var(--danger-soft);color:var(--danger)}
  .badge.done{background:var(--good-soft);color:var(--good)}
  .badge.due{background:var(--warn-soft);color:var(--warn)}
  .badge.overdue{background:var(--danger-soft);color:var(--danger)}

  .case-body{padding:0 15px 15px;border-top:1px solid var(--line);display:none}
  .case[open-state="1"] .case-body{display:block}
  .sec-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:14px 0 7px}

  .docs{display:grid;gap:6px}
  .doc{
    display:flex;align-items:flex-start;gap:9px;background:var(--card-soft);
    border:1px solid var(--line);border-radius:11px;padding:8px 11px;cursor:pointer;font-size:14px;
  }
  .doc:hover{border-color:var(--brand)}
  .doc input{
    appearance:none;-webkit-appearance:none;margin:1px 0 0;flex:0 0 24px;width:24px;height:24px;
    border:2px solid var(--ink-faint);border-radius:7px;background:var(--card);cursor:pointer;position:relative;
  }
  .doc input:checked{background:var(--brand);border-color:var(--brand)}
  .doc input:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;
    color:#fff;font-size:15px;font-weight:800}
  @media (prefers-color-scheme: dark){ .doc input:checked::after{color:#08201d} }
  .doc-text{flex:1;min-width:0}
  .doc-text .lbl{font-weight:600;display:block}
  .doc input:checked ~ .doc-text .lbl{text-decoration:line-through;opacity:.55}
  .doc .rm{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:20px;
    width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;padding:0;line-height:1;
    margin:-8px -6px -8px 0;border-radius:9px}
  .doc .rm:hover{color:var(--danger);background:var(--danger-soft)}

  /* ---------- scans ---------- */
  .doc-wrap{display:grid;gap:5px}
  .ic-btn{
    background:none;border:none;cursor:pointer;font-size:19px;line-height:1;padding:0;
    color:var(--ink-soft);
    width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;
    margin:-8px 0;border-radius:9px;transition:.12s;
  }
  .ic-btn:hover{background:var(--brand-soft);transform:scale(1.06)}
  .scans{display:flex;gap:6px;flex-wrap:wrap;padding-inline-start:30px}
  .thumb{
    width:54px;height:54px;border-radius:9px;border:1.5px solid var(--line);
    background:var(--card-soft) center/cover no-repeat;cursor:pointer;padding:0;
    display:grid;place-items:center;font-size:20px;transition:.12s;
  }
  .thumb:hover{border-color:var(--brand);transform:scale(1.05)}
  .thumb.missing{opacity:.4}
  .thumb.add{border-style:dashed;font-size:24px;color:var(--ink-soft);font-weight:400}
  .thumb.add:hover{background:var(--brand-soft);color:var(--brand-ink)}
  .case-scans{padding-inline-start:0}
  .thumb:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  .scan-box{max-width:640px;text-align:center}
  .scan-box img{max-width:100%;max-height:65vh;border-radius:12px;display:block;margin:0 auto}
  .scan-fallback{font-size:56px;padding:26px 0}
  .scan-meta{font-size:12px;color:var(--ink-faint);margin-top:9px;word-break:break-all}
  a.btn{text-decoration:none;display:inline-block;text-align:center}

  .progress{display:block;height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 0}
  .progress i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .2s}

  .notes{display:grid;gap:6px}
  .note{background:var(--card-soft);border:1px solid var(--line);border-radius:11px;padding:8px 11px;font-size:13.5px}
  .note .when{display:block;font-size:11px;color:var(--ink-faint);margin-bottom:2px}
  .note .rm{float:inline-end;background:none;border:none;color:var(--ink-faint);cursor:pointer;
    font-size:19px;width:44px;height:44px;display:grid;place-items:center;padding:0;line-height:1;
    margin:-10px -8px 0 0;border-radius:9px}
  .note .rm:hover{color:var(--danger);background:var(--danger-soft)}

  .row-add{display:flex;gap:6px;margin-top:7px}
  .row-add input,.row-add textarea{flex:1;min-width:0}

  /* ---------- forms ---------- */
  label.f{display:block;margin:11px 0 0}
  label.f > span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
  input[type=text],input[type=date],select,textarea{
    width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--card-soft);
    border:1.5px solid var(--line);border-radius:11px;padding:9px 11px;
  }
  textarea{resize:vertical;min-height:64px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:520px){ .grid2{grid-template-columns:1fr} }

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(8,25,23,.55);display:none;align-items:flex-start;
    justify-content:center;padding:16px;overflow-y:auto;z-index:50}
  .modal[data-open="1"]{display:flex}
  .modal-box{background:var(--card);border-radius:18px;max-width:560px;width:100%;padding:18px 16px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
  .modal-box h2{margin:0 0 4px;font-size:19px}
  .modal-actions{display:flex;gap:8px;margin-top:18px}
  .modal-actions .btn{flex:1}

  /* ---------- directory / glossary ---------- */
  .dir{display:grid;gap:9px}
  .dir-item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px}
  .dir-item h3{margin:0 0 3px;font-size:15.5px}
  .dir-item .native{font-size:13px;color:var(--ink-soft);margin:0 0 7px}
  .dir-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  .dir-links a{
    font-size:12.5px;font-weight:600;text-decoration:none;color:var(--brand-ink);
    background:var(--brand-soft);border-radius:8px;padding:5px 10px;
  }
  .dir-links a:hover{text-decoration:underline}
  .sub-note{font-size:12px;color:var(--ink-soft);margin:10px 0 6px;line-height:1.5}
  .subs{list-style:none;margin:9px 0 0;padding:0;display:grid;gap:5px}
  .sub{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-height:44px;
    background:var(--card-soft);border:1px solid var(--line);border-radius:11px;padding:7px 11px;
  }
  .sub-name{flex:1;min-width:120px;font-size:14px;font-weight:600}
  .sub-tr{display:block;font-size:11px;font-weight:500;color:var(--ink-soft);direction:ltr;unicode-bidi:isolate}
  .sub-code{
    font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
    background:var(--brand-soft);color:var(--brand-ink);border-radius:7px;padding:3px 9px;min-width:38px;text-align:center;
  }
  .sub-link{
    font-size:12.5px;font-weight:600;text-decoration:none;color:var(--brand-ink);
    background:var(--brand-soft);border-radius:8px;padding:0 11px;min-height:36px;display:inline-flex;align-items:center;
  }
  .sub-link:hover{text-decoration:underline}
  .sub-none{font-size:11.5px;color:var(--ink-faint);font-style:italic}

  .gloss{display:grid;gap:7px}
  .gterm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .gterm .g-he{font-size:16px;font-weight:700;direction:rtl;unicode-bidi:isolate}
  .gterm .g-tr{font-size:12px;color:var(--ink-faint);direction:ltr;unicode-bidi:isolate}
  .gterm .g-def{flex:1;min-width:180px;font-size:13.5px;color:var(--ink-soft)}

  .empty{text-align:center;padding:34px 16px;color:var(--ink-faint)}
  .empty .big{font-size:44px;display:block;margin-bottom:8px}
  .empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}
  .empty p{max-width:34ch;margin:0 auto 16px}
  .quick{margin-top:6px;text-align:start}
  .quick h3{font-size:14px;margin:0 0 3px;color:var(--ink)}
  .quick .hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 11px}
  .quick-grid{display:grid;gap:8px;grid-template-columns:1fr}
  @media (min-width:560px){ .quick-grid{grid-template-columns:1fr 1fr} }
  .qbtn{
    display:flex;align-items:center;gap:10px;width:100%;min-height:56px;
    font:inherit;font-size:14.5px;font-weight:600;text-align:start;cursor:pointer;
    background:var(--card-soft);border:1.5px solid var(--line);border-radius:13px;
    padding:10px 13px;color:var(--ink);transition:.12s;
  }
  .qbtn:hover{border-color:var(--brand);background:var(--brand-soft)}
  .qbtn .q-ic{font-size:21px;flex:0 0 auto;line-height:1}
  .qbtn .q-txt{flex:1;min-width:0}
  .qbtn .q-sub{display:block;font-weight:500;font-size:11.5px;color:var(--ink-soft)}

  .notice{
    background:var(--card);color:var(--ink-soft);border:1px solid var(--line);
    border-inline-start:4px solid var(--warn);
    border-radius:12px;padding:11px 13px;
    font-size:12.5px;font-weight:500;line-height:1.5;margin-bottom:12px;
  }
  footer.foot{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:22px;line-height:1.7}
  footer.foot .btn{margin:0 3px}
  .credit{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .credit-link{
    display:flex;align-items:center;justify-content:center;gap:11px;flex-wrap:wrap;
    text-decoration:none;color:inherit;border-radius:14px;padding:9px 12px;
    transition:background .12s ease;
  }
  a.credit-link{cursor:pointer}
  a.credit-link:hover{background:var(--card-soft)}
  a.credit-link:hover .c-name{color:var(--brand-ink);text-decoration:underline}
  a.credit-link:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  .credit img{
    width:44px;height:44px;border-radius:10px;object-fit:contain;flex:0 0 auto;
    background:#fff;border:1px solid var(--line);padding:1px;
  }
  .credit .c-txt{text-align:start}
  .credit .c-lead{display:block;font-size:11.5px;color:var(--ink-soft)}
  .credit .c-name{font-size:14px;font-weight:700;color:var(--ink)}
  .credit .c-tr{font-size:11px;font-weight:500;color:var(--ink-soft);direction:ltr;unicode-bidi:isolate}
  .credit .c-tag{
    display:block;font-size:11.5px;color:var(--ink-soft);max-width:30ch;line-height:1.45;

/* The processes a new arrival actually starts with, in rough chronological
   order. Keys index into TEMPLATES — no separate data to keep in sync. */
const QUICK = ['teudat_zehut','sal_klita','health','btl_register','bank_account','license'];
const QUICK_IC = {teudat_zehut:'\u{1F194}', sal_klita:'\u{1F4B0}', health:'\u{1F3E5}',
                  btl_register:'\u{1F3DB}️', bank_account:'\u{1F3E6}', license:'\u{1F697}'};

/* ======================= STATE ======================= */
const KEY = 'klaser.v1';
let lang = 'he';
let cases = [];
let filter = 'all';
let tab = 'cases';
let editingId = null;

function load(){
  try{
    const raw = JSON.parse(localStorage.getItem(KEY) || '{}');
    cases = Array.isArray(raw.cases) ? raw.cases : [];
    /* titles saved before titles were derived are frozen in their creation
       language; release the ones that are still just the template name */
    cases.forEach(c => {
      if(!c.title) return;
      const names = [];
      const tpl = c.template && TEMPLATES[c.template];
      const ag  = AGENCIES[c.agency];
      LANGS.forEach(l => { if(tpl) names.push(tpl[l.code]); if(ag) names.push(ag[l.code]); });
      if(names.indexOf(c.title) !== -1) c.title = '';
    });
    if(raw.lang && LANGS.some(l=>l.code===raw.lang)) lang = raw.lang;
  }catch(e){ cases = []; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({lang, cases})); }catch(e){}
}

/* ======================= HELPERS ======================= */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2,10);

function t(key, vars){
  let s = (STR[key] && (STR[key][lang] || STR[key].en)) || key;
  if(vars) for(const k in vars) s = s.replace('{'+k+'}', vars[k]);
  return s;
}
/* Name of a reference-data entry in the current UI language. */
function nameOf(obj){ return obj ? (obj[lang] || obj.en || obj.he) : ''; }

/* A case created from a template has no title of its own: it is named after
   the template, in whatever language is showing. Storing that name would
   freeze it into the creation language, so it is derived on every render.
   An empty c.title means "auto"; anything else is the user's own words and
   is never touched. */
function autoTitle(template, agency){
  const tpl = template && TEMPLATES[template];
  if(tpl) return nameOf(tpl);
  return AGENCIES[agency] ? nameOf(AGENCIES[agency]) : '';
}
function caseTitle(c){ return c.title || autoTitle(c.template, c.agency); }

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* The Hebrew term + transliteration, shown regardless of UI language,
   so the user can point at the screen at the counter. */
function heChip(obj){
  if(!obj || !obj.he) return '';
  if(lang === 'he') return '';
  return `<span class="he-term">${esc(obj.he)}${obj.tr?`<span class="tr">${esc(obj.tr)}</span>`:''}</span>`;
}
function todayISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return null;
  const now = new Date(todayISO() + 'T00:00:00');
  return Math.round((d - now) / 86400000);
}

/* ======================= SCANS =======================
   Images live in IndexedDB (blobs) rather than localStorage, which is far too
   small for photos. The case record stores only lightweight metadata plus the
   id that resolves to the blob. Nothing is ever uploaded. */
const DB_NAME='klaser', STORE='scans', MAX_BYTES=25*1024*1024;
let _db=null;
function idb(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
    r.onsuccess=()=>{ _db=r.result; res(_db); };
    r.onerror=()=>rej(r.error);
  });
}
function idbTx(mode,fn){
  return idb().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(STORE,mode), req=fn(tx.objectStore(STORE));
    tx.oncomplete=()=>res(req?req.result:undefined);
    tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
  }));
}
const scanPut=(id,blob)=>idbTx('readwrite',st=>st.put(blob,id));

/* Browsers may evict IndexedDB under storage pressure. Ask for exemption the
   first time a scan is stored — asking on load, before the user has done
   anything, is more likely to be refused. */
let persistAsked=false;
function requestPersistence(){
  if(persistAsked || !navigator.storage || !navigator.storage.persist) return;
  persistAsked=true;
  navigator.storage.persisted().then(p=>{ if(!p) navigator.storage.persist(); }).catch(()=>{});
}
const scanGet=id      =>idbTx('readonly', st=>st.get(id));
const scanDel=id      =>idbTx('readwrite',st=>st.delete(id));

/* Shrink a photo before storing it: a phone camera shot is several MB, but a
   readable document scan needs far less. Non-images pass through untouched. */
function compress(file, maxDim=1600, quality=.75){
  return new Promise(res=>{
    if(!/^image\//.test(file.type) || file.type==='image/gif') return res(file);
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth, h=img.naturalHeight;
      const scale=Math.min(1, maxDim/Math.max(w,h));
      w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>{ URL.revokeObjectURL(url); res(b&&b.size<file.size ? b : file); },'image/jpeg',quality);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}

/* Thumbnails are painted after render, since reading blobs is async. */
let thumbUrls=[];
function revokeThumbs(){ thumbUrls.forEach(u=>URL.revokeObjectURL(u)); thumbUrls=[]; }
async function hydrateThumbs(){
  revokeThumbs();
  for(const el of $$('.thumb[data-scan]')){
    try{
      const blob=await scanGet(el.dataset.scan);
      if(!blob){ el.classList.add('missing'); el.textContent='?'; continue; }
      if(/^image\//.test(blob.type)){
        const u=URL.createObjectURL(blob); thumbUrls.push(u);
        el.style.backgroundImage='url("'+u+'")';
      }else{ el.textContent='\u{1F4C4}'; }
    }catch(e){ el.classList.add('missing'); }
  }
}
const allScans = () => cases.flatMap(c=>[...(c.scans||[]), ...c.docs.flatMap(d=>d.scans||[])]);
function humanSize(bytes){
  return bytes < 1048576 ? Math.max(1,Math.round(bytes/1024)) + ' KB'
                         : (bytes/1048576).toFixed(1) + ' MB';
}

function blobToDataURL(b){
  return new Promise((res,rej)=>{ const fr=new FileReader();
    fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(b); });
}
function dataURLToBlob(u){
  const [head,data]=u.split(','); const mime=(/:(.*?);/.exec(head)||[,'application/octet-stream'])[1];
  const bin=atob(data), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

/* ======================= RENDER ======================= */
function applyLang(){
  const meta = LANGS.find(l=>l.code===lang);
  document.documentElement.lang = lang;
  document.documentElement.dir  = meta.dir;
  $$('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $('#langbar').innerHTML = LANGS.map(l =>
    `<button type="button" data-lang="${l.code}" aria-pressed="${l.code===lang}">${esc(l.label)}</button>`
  ).join('');
  $$('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab===tab));
}

function renderStats(){
  const open = cases.filter(c=>c.status!=='done').length;
  const missing = cases.reduce((n,c)=> n + c.docs.filter(d=>!d.done).length, 0);
  $('#stats').innerHTML = `
    <div class="stat"><b>${cases.length}</b><span>${esc(t('statAll'))}</span></div>
    <div class="stat"><b>${open}</b><span>${esc(t('statOpen'))}</span></div>
    <div class="stat"><b>${missing}</b><span>${esc(t('statDocs'))}</span></div>`;
}

function renderFilters(){
  const counts = {};
  STATUSES.forEach(s => counts[s.key] = cases.filter(c=>c.status===s.key).length);
  const items = [`<button type="button" data-f="all" aria-pressed="${filter==='all'}">${esc(t('filterAll'))} (${cases.length})</button>`]
    .concat(STATUSES.filter(s=>counts[s.key]>0).map(s =>
      `<button type="button" data-f="${s.key}" aria-pressed="${filter===s.key}">${esc(nameOf(s))} (${counts[s.key]})</button>`));
  $('#filters').innerHTML = items.join('');
}

function deadlineBadge(c){
  const n = daysUntil(c.deadline);
  if(n === null || c.status === 'done') return '';
  if(n < 0)  return `<span class="badge overdue">${esc(t('overdue'))}</span>`;
  if(n === 0) return `<span class="badge overdue">${esc(t('dueToday'))}</span>`;
  if(n <= 14) return `<span class="badge due">${esc(t('daysLeft',{n}))}</span>`;
  return '';
}

function renderAgencies(){
  $('#agencyList').innerHTML = Object.keys(AGENCIES).map(k => {
    const a = AGENCIES[k];
    if(k === 'other') return '';
    const links = [];
    if(a.tel) links.push(`<a href="tel:${esc(a.tel.replace(/[^0-9*#+]/g,''))}" dir="ltr">${esc(t('phone'))}: ${esc(a.tel)}</a>`);
    if(a.tel2) links.push(`<a href="tel:+972${esc(a.tel2.replace(/[^0-9]/g,'').replace(/^0/,''))}" dir="ltr">${esc(t('phoneAbroad'))}: ${esc(a.tel2)}</a>`);
    if(a.url) links.push(`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(t('website'))} ↗</a>`);
    const kids = (a.children||[]).map(ch => `
      <li class="sub">
        <span class="sub-name" dir="auto">${esc(ch.he)}<span class="sub-tr">${esc(ch.tr)}</span></span>
        ${ch.code?`<span class="sub-code" dir="ltr" title="${esc(t('bankCode'))}">${esc(ch.code)}</span>`:''}
        ${ch.url
          ? `<a class="sub-link" href="${esc(ch.url)}" target="_blank" rel="noopener">${esc(t('website'))} ↗</a>`
          : `<span class="sub-none">${esc(t('noSiteYet'))}</span>`}
      </li>`).join('');
    return `<div class="dir-item">
      <h3>${esc(nameOf(a))}</h3>
      <p class="native"><span class="he-term">${esc(a.he)}<span class="tr">${esc(a.tr)}</span></span></p>
      ${links.length?`<div class="dir-links">${links.join('')}</div>`:''}
      ${kids?`${k==='bank'?`<p class="sub-note">${esc(t('bankCodeNote'))}</p>`:''}<ul class="subs">${kids}</ul>`:''}
    </div>`;
  }).join('');
}

function renderGlossary(){
  const q = ($('#glossSearch').value || '').trim().toLowerCase();
  /* Search every language at once, not just the active one: someone using
     the French UI may only know the English word, or vice versa. */
  const rows = GLOSSARY.filter(g =>
    !q || g.he.includes(q) ||
    LANGS.some(l => String(g[l.code] || '').toLowerCase().includes(q)) ||
    g.tr.toLowerCase().includes(q));
  $('#glossList').innerHTML = rows.length ? rows.map(g => `
    <div class="gterm">
      <div><div class="g-he">${esc(g.he)}</div><div class="g-tr">${esc(g.tr)}</div></div>
      <div class="g-def">${esc(nameOf(g))}</div>
    </div>`).join('')
    : `<div class="card empty">${esc(t('noResults'))}</div>`;
}

function renderCredit(){
  /* the mark and every line of text are one target, so a tap anywhere in the
     block reaches the site. alt is empty because the anchor is labelled. */
  const inner = `
    ${CREDIT.logo?`<img src="${esc(CREDIT.logo)}" alt="">`:''}
    <span class="c-txt">
      <span class="c-lead">${esc(t('builtBy'))}</span>
      <span class="c-name">${esc(CREDIT.he)}</span>${CREDIT.tr?` <span class="c-tr">${esc(CREDIT.tr)}</span>`:''}
      <span class="c-tag">${esc(t('builtByTag'))}</span>
    </span>`;
  $('#credit').innerHTML = CREDIT.url
    ? `<a class="credit-link" href="${esc(CREDIT.url)}" target="_blank" rel="noopener"
          aria-label="${esc(t('builtBy'))} ${esc(CREDIT.he)} — ${esc(t('website'))}">${inner}</a>`
    : `<div class="credit-link">${inner}</div>`;
  const im = $('#credit img');
  if(im) im.addEventListener('error', () => im.remove());

function render(){
  applyLang();
  renderCredit();
  $('#view-cases').hidden    = tab !== 'cases';
  $('#view-agencies').hidden = tab !== 'agencies';
  $('#view-glossary').hidden = tab !== 'glossary';
  if(tab === 'cases'){
    /* On an empty list the stats read 0/0/0, the filter says "All (0)" and the
       toolbar duplicates the empty card's button — four competing elements
       where a first-time user needs one. Hide them until there is data. */
    const has = cases.length > 0;
    $('#stats').hidden = !has; $('#filters').hidden = !has; $('#toolbar').hidden = !has;
    renderStats(); renderFilters(); renderCases();
  }
  if(tab === 'agencies') renderAgencies();
  if(tab === 'glossary') renderGlossary();
}

/* ======================= MODAL ======================= */
function fillSelects(){
  $('#fTemplate').innerHTML = `<option value="">${esc(t('custom'))}</option>` +
    Object.keys(TEMPLATES).map(k=>`<option value="${k}">${esc(nameOf(TEMPLATES[k]))}</option>`).join('');
  $('#fAgency').innerHTML = Object.keys(AGENCIES)
    .map(k=>`<option value="${k}">${esc(nameOf(AGENCIES[k]))}${AGENCIES[k].he && lang!=='he' ? ' — '+AGENCIES[k].he : ''}</option>`).join('');
  $('#fStatus').innerHTML = STATUSES
    .map(s=>`<option value="${s.key}">${esc(nameOf(s))}</option>`).join('');
}

function openModal(id){
  editingId = id || null;
  fillSelects();
  const c = id ? cases.find(x=>x.id===id) : null;
  $('#modalTitle').textContent = t(id ? 'editCase' : 'addCase');
  $('#fTemplate').value = c ? (c.template || '') : '';
  $('#fTemplate').parentElement.style.display = id ? 'none' : 'block';
  $('#fTitle').value    = c ? caseTitle(c) : '';
  $('#fAgency').value   = c ? c.agency : 'btl';
  $('#fStatus').value   = c ? c.status : 'todo';
  $('#fRef').value      = c ? (c.ref||'') : '';
  $('#fOpened').value   = c ? (c.opened||'') : todayISO();
  $('#fDeadline').value = c ? (c.deadline||'') : '';
  $('#modal').dataset.open = '1';
  $('#fTitle').focus();
}
function closeModal(){ $('#modal').dataset.open = '0'; editingId = null; }

/* One tap from the empty state to a usable case. Same shape saveFromModal
   produces — this only skips the form, it adds no new rules. */
function addFromTemplate(key){
  const tpl = TEMPLATES[key];
  if(!tpl) return;
  cases.unshift({
    id:uid(), template:key, title:'', agency:tpl.agency, status:'todo',
    ref:'', opened:todayISO(), deadline:'', open:true,
    docs: tpl.docs.map(k=>({id:uid(), key:k, done:false})), notes:[]
  });
  save(); render();
}

function saveFromModal(){
  const tpl = $('#fTemplate').value;
  const agency = $('#fAgency').value;
  const typed = $('#fTitle').value.trim();
  /* left as the template/agency name -> keep it automatic so it follows the
     interface language; renamed -> keep exactly what was typed */
  const template = editingId ? (cases.find(x=>x.id===editingId)||{}).template : (tpl || null);
  const title = (!typed || typed === autoTitle(template, agency)) ? '' : typed;
  const base = {
    title,
    agency:   agency,
    status:   $('#fStatus').value,
    ref:      $('#fRef').value.trim(),
    opened:   $('#fOpened').value,
    deadline: $('#fDeadline').value
  };
  if(editingId){
    const c = cases.find(x=>x.id===editingId);
    Object.assign(c, base);
  }else{
    const docs = (tpl ? TEMPLATES[tpl].docs : []).map(k=>({id:uid(), key:k, done:false}));
    cases.unshift(Object.assign({id:uid(), template:tpl||null, docs, notes:[], open:true}, base));
  }
  save(); closeModal(); render();
}

/* When a template is picked, snap the agency to match it. */
$('#fTemplate').addEventListener('change', e => {
  const tpl = TEMPLATES[e.target.value];
  if(tpl){
    $('#fAgency').value = tpl.agency;
    if(!$('#fTitle').value.trim()) $('#fTitle').value = nameOf(tpl);
  }
});

/* Delegated handling for everything inside a case card. */
$('#caseList').addEventListener('click', e => {
  if(e.target.closest('#emptyNew')){ openModal(null); return; }
  if(e.target.closest('#emptyScan')){ letterTarget = null; $('#letterInput').click(); return; }
  if(e.target.closest('#clearFilter')){ filter='all'; render(); return; }
  const q = e.target.closest('[data-act="quick"]');
  if(q){ addFromTemplate(q.dataset.tpl); return; }
  const card = e.target.closest('.case'); if(!card) return;
  const c = cases.find(x=>x.id===card.dataset.id); if(!c) return;
  const act = e.target.closest('[data-act]')?.dataset.act;

  if(act === 'toggle'){ c.open = !c.open; save(); renderCases(); return; }
  if(act === 'attach'){
    /* an empty docId means the scan belongs to the case itself */
    pending = {caseId:c.id, docId:e.target.dataset.doc || null};
    $('#scanInput').click(); return;
  }
  if(act === 'openscan'){
    openScan(c.id, e.target.dataset.doc, e.target.dataset.scan); return;
  }
  if(act === 'rmdoc'){
    const gone = c.docs.find(d=>d.id === e.target.dataset.doc);
    (gone && gone.scans || []).forEach(sc => scanDel(sc.id).catch(()=>{}));
    c.docs = c.docs.filter(d=>d.id !== e.target.dataset.doc); save(); renderCases(); return;
  }
  if(act === 'adddoc'){
    const inp = card.querySelector('[data-act="newdoc"]');
    const v = inp.value.trim();
    if(v){ c.docs.push({id:uid(), text:v, done:false}); save(); renderCases(); }
    return;
  }
  if(act === 'addnote'){
    const inp = card.querySelector('[data-act="newnote"]');
    const v = inp.value.trim();
    if(v){ c.notes.unshift({id:uid(), date:todayISO(), text:v}); save(); renderCases(); }
    return;
  }
  if(act === 'rmnote'){
    c.notes = c.notes.filter(n=>n.id !== e.target.dataset.note); save(); renderCases(); return;
  }
  if(act === 'fill'){ openFill(c.id); return; }
  if(act === 'attachletter'){
    if(!AI.cfg.enabled){ alert(t('aiUnavailable')); return; }
    letterTarget = c.id; $('#letterInput').click(); return;
  }
  if(act === 'edit'){ openModal(c.id); return; }
  if(act === 'del'){
    if(confirm(t('confirmDel'))){
      c.docs.forEach(d => (d.scans||[]).forEach(sc => scanDel(sc.id).catch(()=>{})));
      (c.scans||[]).forEach(sc => scanDel(sc.id).catch(()=>{}));
      cases = cases.filter(x=>x.id!==c.id); save(); render();
    }
    return;
  }
});

/* ---------- scan capture + viewer ---------- */
let pending = null;      /* which document the file picker is filling */
let viewing = null;      /* {caseId, docId, scanId} currently in the lightbox */
let viewUrl = null;

$('#scanInput').addEventListener('change', async e => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if(!files.length || !pending) return;
  const c = cases.find(x=>x.id===pending.caseId);
  if(!c) return;
  /* target is either a document or the case itself */
  const d = pending.docId ? c.docs.find(x=>x.id===pending.docId) : c;
  if(!d) return;
  d.scans = d.scans || [];
  for(const f of files){
    if(f.size > MAX_BYTES){ alert(t('scanBig')); continue; }
    try{
      const blob = await compress(f);
      const id = uid();
      await scanPut(id, blob);
      requestPersistence();
      d.scans.push({id, name:f.name || 'scan', type:blob.type, size:blob.size, added:todayISO()});
    }catch(err){ alert(t('scanQuota')); break; }
  }
  pending = null;
  save(); renderCases();
});

async function openScan(caseId, docId, scanId){
  const c = cases.find(x=>x.id===caseId);
  const d = docId ? (c && c.docs.find(x=>x.id===docId)) : c;
  const meta = d && (d.scans||[]).find(x=>x.id===scanId);
  if(!meta) return;
  viewing = {caseId, docId, scanId};
  const blob = await scanGet(scanId);
  if(viewUrl){ URL.revokeObjectURL(viewUrl); viewUrl=null; }
  const img = $('#scanImg'), fb = $('#scanFallback');
  if(blob){
    viewUrl = URL.createObjectURL(blob);
    const isImg = /^image\//.test(blob.type);
    img.hidden = !isImg; fb.hidden = isImg;
    if(isImg) img.src = viewUrl;
    $('#scanDownload').href = viewUrl;
    $('#scanDownload').download = meta.name || 'scan';
    $('#scanDownload').hidden = false;
  }else{
    img.hidden = true; fb.hidden = false; $('#scanDownload').hidden = true;
  }
  $('#scanMeta').textContent =
    (meta.name||'') + ' · ' + Math.max(1,Math.round((meta.size||0)/1024)) + 'KB · ' + (meta.added||'');
  $('#scanModal').dataset.open = '1';
}
function closeScan(){
  $('#scanModal').dataset.open = '0';
  $('#scanImg').removeAttribute('src');
  if(viewUrl){ URL.revokeObjectURL(viewUrl); viewUrl=null; }
  viewing = null;
}
$('#scanClose').addEventListener('click', closeScan);
$('#scanModal').addEventListener('click', e => { if(e.target.id==='scanModal') closeScan(); });
$('#scanDelete').addEventListener('click', async () => {
  if(!viewing || !confirm(t('scanConfirmDel'))) return;
  const {caseId, docId, scanId} = viewing;
  const c = cases.find(x=>x.id===caseId);
  const d = docId ? (c && c.docs.find(x=>x.id===docId)) : c;
  if(d) d.scans = (d.scans||[]).filter(x=>x.id!==scanId);
  await scanDel(scanId).catch(()=>{});
  closeScan(); save(); renderCases();
});

$('#exportBtn').addEventListener('click', async () => {
  const metas = allScans();
  let blobs = null;
  if(metas.length){
    /* Scans dominate the file size, so let the user choose. A backup without
       them still restores every case, document and note. */
    const bytes = metas.reduce((n,m)=>n+(m.size||0),0) * 1.37;  /* base64 overhead */
    if(confirm(t('backupScans',{n:metas.length, size:humanSize(bytes)}))){
      blobs = {};
      for(const m of metas){
        try{ const b = await scanGet(m.id); if(b) blobs[m.id] = await blobToDataURL(b); }catch(e){}
      }
    }
  }
  const payload = {lang, cases};
  if(blobs) payload.scanData = blobs;
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');

/* Nobody finds a tool like this by searching — it spreads person to person,
   usually over WhatsApp. Use the native share sheet where it exists. */
$('#shareBtn').addEventListener('click', async () => {
  const url = location.href.split('#')[0];
  const text = t('shareText');
  const wa = 'https://wa.me/?text=' + encodeURIComponent(text + ' ' + url);
  if(navigator.share){
    try{ await navigator.share({title:t('appTitle'), text, url}); return; }
    catch(e){
      if(e && e.name === 'AbortError') return;   /* user closed the sheet */
      /* awaiting share consumed the user gesture, so window.open would be
         popup-blocked here; navigate instead. State is already persisted. */
      location.href = wa; return;
    }
  }
  window.open(wa, '_blank', 'noopener');   /* still inside the gesture */
});
$('#importFile').addEventListener('change', e => {

/* ---------- header video ----------
   Decorative only: the <h1> carries the name and is merely hidden once the
   video is confirmed playing. Muted + playsinline is what makes autoplay
   permitted at all; the file also carries an audio track, which must never
   start on its own. */
(function initHero(){
  const wrap = $('#hero'), vid = $('#heroVid'), h1 = $('#appH1'), play = $('#heroPlay');
  if(!wrap || !vid) return;

  /* The poster makes the header meaningful before a single video byte
     arrives, so the hero is shown straight away rather than waiting for
     playback — autoplay is refused far too often to gate on it: sandboxed
     iframes, iOS low-power mode, data saver, several Android browsers. */
  wrap.hidden = false;
  h1.classList.add('replaced');

  /* Only a genuine load failure falls back to the text title. */
  vid.addEventListener('error', () => {
    wrap.remove();
    h1.classList.remove('replaced');
  }, {once:true});

  const showPlay = () => {
    play.hidden = false;
    play.setAttribute('aria-label', t('playVideo'));
  };
  play.addEventListener('click', () => {
    vid.play().then(() => { play.hidden = true; }).catch(() => {});
  });

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ vid.removeAttribute('autoplay'); vid.pause(); showPlay(); return; }

  vid.muted = true;                    /* required before autoplay is permitted */

  /* The attribute does the work; this is a backstop for browsers that defer
     until the element is scripted, and it retries once the first frames land
     in case the attempt ran before there was anything to play. */
  const tryPlay = () => {
    const a = vid.play();
    if(a && a.catch) a.catch(() => { if(vid.paused) showPlay(); });
  };
  tryPlay();
  vid.addEventListener('loadeddata', () => { if(vid.paused) tryPlay(); }, {once:true});
  vid.addEventListener('canplay',    () => { if(vid.paused) tryPlay(); }, {once:true});
  /* 'play' fires on the attempt and still fires when the attempt is then
     refused, which would hide the button again straight after the rejection
     revealed it. 'playing' only fires once the media is really advancing. */
  vid.addEventListener('playing', () => { play.hidden = true; });

  /* if a tab is opened in the background, autoplay is commonly deferred */
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden && vid.paused) tryPlay();
  });

  /* Where a browser refuses to start it by itself, the first interaction of
     any kind counts as the gesture it was waiting for — so it starts on the
     user's first touch or scroll rather than making them hunt for the button. */
  const kick = () => { if(vid.paused) tryPlay(); };
  ['pointerdown','touchstart','keydown','scroll','wheel'].forEach(evt =>
    window.addEventListener(evt, kick, {once:true, passive:true}));

  /* and once it is actually on screen, in case the attempt ran too early */
  if('IntersectionObserver' in window){
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if(e.isIntersecting && vid.paused) tryPlay(); });
    }, {threshold:0.1});
    io.observe(vid);
  }
})();

/* =====================================================================
   READING A LETTER  (optional, off unless an endpoint is configured)
   =====================================================================
   The only place in this app that makes a network request. Everything here
   is behind an explicit per-document consent, and every failure path falls
   back to the app behaving exactly as it does without it. */

const AI = {
  cfg: {endpoint:'', enabled:false},
  token: null,
  quota: null,
  health: null,

  load(){
    try{
      const raw = localStorage.getItem('klaser.ai');
      if(raw) Object.assign(this.cfg, JSON.parse(raw));
    }catch{}
    /* A build can ship an endpoint by setting window.KLASER_AI_ENDPOINT. Without
       one, the feature does not exist as far as the interface is concerned. */
    if(!this.cfg.endpoint && window.KLASER_AI_ENDPOINT) this.cfg.endpoint = window.KLASER_AI_ENDPOINT;
    this.cfg.enabled = !!this.cfg.endpoint;
    return this.cfg.enabled;
  },

  save(){ try{ localStorage.setItem('klaser.ai', JSON.stringify(this.cfg)); }catch{} },

  url(path){ return this.cfg.endpoint.replace(/\/+$/,'') + path; },

  async checkHealth(){
    if(!this.cfg.enabled) return null;
    try{
      const r = await fetch(this.url('/v1/health'), {method:'GET'});
      this.health = await r.json();
    }catch{ this.health = {status:'degraded', accepts_analysis:false, reason:'upstream'}; }
    return this.health;
  },

  async getToken(){
    if(this.token) return this.token;
    try{ this.token = localStorage.getItem('klaser.aitoken') || null; }catch{}
    if(this.token) return this.token;
    const r = await fetch(this.url('/v1/token'), {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({turnstile_token:''})
    });
    if(!r.ok) throw new Error('token');
    const d = await r.json();
    this.token = d.token; this.quota = d.quota;
    try{ localStorage.setItem('klaser.aitoken', d.token); }catch{}
    return this.token;
  },

  /* Consent is recorded per document, never as a standing permission. What is
     stored is only that the user has seen the explanation once, so the wording
     is not repeated on every single scan; the send itself is still a separate
     deliberate tap each time. */
  seenConsent(){ try{ return localStorage.getItem('klaser.consent') === '1'; }catch{ return false; } },
  recordConsent(){ try{ localStorage.setItem('klaser.consent','1'); }catch{} },

  async analyze(blob, hint){
    const token = await this.getToken();
    const b64 = (await blobToDataURL(blob)).split(',')[1];
    const r = await fetch(this.url('/v1/analyze'), {
      method:'POST',
      headers:{'content-type':'application/json', authorization:'Bearer '+token},
      body: JSON.stringify({
        image: b64,
        media_type: blob.type || 'image/jpeg',
        /* scope is fixed: the server rejects anything else, so a bug here cannot
           turn one document into a standing permission */
        consent: {granted_at:new Date().toISOString(), scope:'single_document'},
        hint: hint || undefined
      })
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok){
      if(data.error && data.error.code === 'invalid_token'){
        try{ localStorage.removeItem('klaser.aitoken'); }catch{}
        this.token = null;
      }
      const e = new Error(data.error ? data.error.code : 'http_'+r.status);
      e.he = data.error ? data.error.message_he : t('aiUnavailable');
      throw e;
    }
    this.quota = data.meta && data.meta.quota;
    return data;
  }
};

/* ---------- the modal used for consent, progress and review ---------- */
function aiSheet(title, bodyHTML, actions){
  $('#aiTitle').textContent = title;
  $('#aiBody').innerHTML = bodyHTML;
  const bar = $('#aiActions');
  bar.innerHTML = '';
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : '');
    b.type = 'button';
    b.textContent = a.label;
    b.addEventListener('click', a.on);
    bar.appendChild(b);
  });
  $('#aiModal').dataset.open = '1';
}
function aiClose(){ $('#aiModal').dataset.open = '0'; }

function askConsent(){
  return new Promise(resolve => {
    if(AI.seenConsent()) return resolve(true);
    aiSheet(t('aiConsentTitle'),
      `<p style="white-space:pre-line;font-size:14px;line-height:1.6" dir="auto">${esc(t('aiConsentBody'))}</p>`,
      [ {label:t('aiAccept'), primary:true, on:()=>{ AI.recordConsent(); aiClose(); resolve(true); }},
        {label:t('aiDecline'), on:()=>{ aiClose(); resolve(false); }} ]);
  });
}

/* ---------- review before anything is written ---------- */
let lastAdd = null;   /* supports one-tap undo */

function showReview(data, targetCaseId){
  const res = data.result || {};
  if(res.not_a_letter){
    aiSheet(t('reviewTitle'), `<p dir="auto">${esc(t('aiNotLetter'))}</p>`,
      [{label:t('scanClose'), primary:true, on:aiClose}]);
    return;
  }

  const req = res.required_docs || [];
  const extra = res.extra_docs || [];
  if(!req.length && !extra.length){
    aiSheet(t('reviewTitle'), `<p dir="auto">${esc(t('reviewNothing'))}</p>`,
      [{label:t('scanClose'), primary:true, on:aiClose}]);
    return;
  }

  const ag = res.agency ? AGENCIES[res.agency] : null;
  const free = data.meta && data.meta.credits_charged === 0;
  const left = data.meta && data.meta.quota ? data.meta.quota.remaining : null;

  const row = (id, label, chip, evidence, unverified) => `
    <label class="doc" style="align-items:flex-start">
      <input type="checkbox" data-pick="${id}" checked>
      <span class="doc-text" style="display:block">
        <span class="lbl" dir="auto">${esc(label)}</span>${chip}
        ${unverified?`<span class="badge problem" style="margin-inline-start:6px">${esc(t('reviewUnverified'))}</span>`:''}
        ${evidence?`<span style="display:block;font-size:12px;color:var(--ink-soft);margin-top:3px" dir="auto">\u{201C}${esc(evidence)}\u{201D}</span>`:''}
      </span>
    </label>`;

  const meta = [];
  if(ag) meta.push(esc(nameOf(ag)) + (lang!=='he' ? ' · '+esc(ag.he) : ''));
  if(res.reference) meta.push(`<span dir="ltr">${esc(res.reference)}</span>`);
  if(res.deadline)  meta.push(esc(t('deadline'))+': <span dir="ltr">'+esc(res.deadline)+'</span>');

  aiSheet(t('reviewTitle'), `
    <p style="font-size:13px;color:var(--ink-soft)" dir="auto">${esc(t('reviewBody'))}</p>
    ${meta.length?`<div class="case-meta" style="margin-bottom:8px">${meta.join(' · ')}</div>`:''}
    ${free?`<div class="badge done" style="margin-bottom:8px">${esc(t('freeHit'))}</div>`:''}
    <div class="docs">
      ${req.map((d,i)=>row('r'+i, nameOf(DOCS[d.key])||d.key, heChip(DOCS[d.key]), d.evidence, false)).join('')}
      ${extra.map((d,i)=>row('x'+i, d.he, '', d.evidence, true)).join('')}
    </div>
    ${left!==null?`<div style="font-size:12px;color:var(--ink-faint);margin-top:10px">${esc(t('creditsLeft',{n:left}))}</div>`:''}
  `, [
    {label:t('reviewAdd'), primary:true, on:()=>{
      const picked = [...$('#aiBody').querySelectorAll('[data-pick]')].filter(x=>x.checked).map(x=>x.dataset.pick);
      applyAnalysis(res, picked, targetCaseId);
    }},
    {label:t('cancel'), on:aiClose}
  ]);
}

function applyAnalysis(res, picked, targetCaseId){
  const docs = [];
  (res.required_docs||[]).forEach((d,i)=>{ if(picked.includes('r'+i)) docs.push({id:uid(), key:d.key, done:false}); });
  (res.extra_docs||[]).forEach((d,i)=>{ if(picked.includes('x'+i)) docs.push({id:uid(), text:d.he, done:false}); });

  const form = res.form_to_fill && res.form_to_fill.where !== 'none'
    ? {code:res.form_to_fill.form_code || res.form_code || null,
       title_he:res.form_to_fill.form_title_he || res.form_title_he || null,
       where:res.form_to_fill.where}
    : null;

  let c = targetCaseId ? cases.find(x=>x.id===targetCaseId) : null;
  if(c){
    lastAdd = {caseId:c.id, docIds:docs.map(d=>d.id), created:false, prevForm:c.form||null};
    c.docs.push(...docs);
    if(form) c.form = form;
    if(res.ref && !c.ref) c.ref = res.reference;
  }else{
    c = {
      id: uid(),
      template: res.template || null,
      agency: res.agency || 'other',
      title: '',
      status: docs.length ? 'collecting' : 'todo',
      ref: res.reference || '',
      opened: todayISO(),
      deadline: res.deadline || '',
      docs, notes: [], open: true,
      form: form || null
    };
    cases.unshift(c);
    lastAdd = {caseId:c.id, docIds:docs.map(d=>d.id), created:true};
  }
  save(); aiClose(); render();

  aiSheet(t('reviewTitle'),
    `<p dir="auto">${esc(t('reviewAdded'))}</p>`,
    [ {label:t('reviewUndo'), danger:true, on:()=>{ undoAdd(); aiClose(); }},
      {label:t('scanClose'), primary:true, on:aiClose} ]);
}

function undoAdd(){
  if(!lastAdd) return;
  if(lastAdd.created){
    cases = cases.filter(x => x.id !== lastAdd.caseId);
  }else{
    const c = cases.find(x=>x.id===lastAdd.caseId);
    if(c){
      c.docs = c.docs.filter(d => !lastAdd.docIds.includes(d.id));
      c.form = lastAdd.prevForm;
    }
  }
  lastAdd = null;
  save(); render();
}

async function runLetterScan(file, targetCaseId){
  if(!AI.cfg.enabled) return;
  if(!(await askConsent())) return;

  aiSheet(t('aiConsentTitle'), `<p dir="auto">${esc(t('aiWorking'))}</p>`, []);
  try{
    const blob = await compress(file);
    const hint = (()=> {
      const c = targetCaseId ? cases.find(x=>x.id===targetCaseId) : null;
      return c ? {agency:c.agency||null, template:c.template||null} : null;
    })();
    const data = await AI.analyze(blob, hint);
    showReview(data, targetCaseId);
  }catch(err){
    aiSheet(t('aiConsentTitle'),
      `<p dir="auto">${esc(err.he || t('aiUnavailable'))}</p>`,
      [{label:t('scanClose'), primary:true, on:aiClose}]);
  }
}

let letterTarget = null;
$('#letterInput').addEventListener('change', e => {
  const f = (e.target.files||[])[0];
  e.target.value = '';
  if(f) runLetterScan(f, letterTarget);
  letterTarget = null;
});
$('#scanLetter').addEventListener('click', () => { letterTarget = null; $('#letterInput').click(); });

/* =====================================================================

      {id:'address',        he:'כתובת מלאה',                 type:'text',      profile_key:'address',     required:true},
      {id:'city',           he:'יישוב',                      type:'text',      profile_key:'city',        required:true},

      {id:'bank_code',      he:'קוד בנק',                    type:'digits',    profile_key:'bank_code',   required:true, direction:'ltr'},

const PROFILE = {
  data: {},
  load(){ try{ this.data = JSON.parse(localStorage.getItem('klaser.profile') || '{}'); }catch{ this.data = {}; } return this.data; },
  save(){ try{ localStorage.setItem('klaser.profile', JSON.stringify(this.data)); }catch{} }
};

/* The ת״ז check digit. Catching a typo here is worth more than catching it at
   the counter three weeks later. */
function validIsraeliId(v){
  const d = String(v||'').replace(/\D/g,'');
  if(d.length < 5 || d.length > 9) return false;
  const p = d.padStart(9,'0');
  let sum = 0;
  for(let i=0;i<9;i++){
    let n = +p[i] * ((i % 2) + 1);
    if(n > 9) n -= 9;
    sum += n;
  }
  return sum % 10 === 0;
}

let fillCaseId = null;

function openFill(caseId){
  const c = cases.find(x=>x.id===caseId); if(!c) return;
  fillCaseId = caseId;
  PROFILE.load();
  const map = c.form && c.form.code ? FORMS[c.form.code] : null;
  const title = (c.form && c.form.title_he) || (map && map.he) || caseTitle(c);

  $('#fillTitleH').textContent = t('fillTitle');

  const fields = map ? map.fields : Object.keys(PROFILE.data).map(k => ({id:k, he:k, type:'text', profile_key:k}));
  const rows = fields.map(f => {
    const val = PROFILE.data[f.profile_key] || '';
    const dir = f.direction === 'ltr' ? 'ltr' : 'auto';
    const bad = f.type === 'id_number' && val && !validIsraeliId(val);
    return `<label class="field">
      <span>${esc(f.he)}${f.required?' *':''}</span>
      <input type="${f.type==='date'?'date':'text'}" data-fill="${esc(f.profile_key)}"
             value="${esc(val)}" dir="${dir}" autocomplete="off"
             ${f.type==='date'?'':'inputmode="'+(f.type==='digits'||f.type==='id_number'?'numeric':'text')+'"'}>
      ${bad?`<span class="badge problem">\u{2717}</span>`:''}
    </label>`;
  }).join('');

  const missing = fields.filter(f => f.required && !PROFILE.data[f.profile_key]).length;

  $('#fillBody').innerHTML = `
    <div class="case-meta" style="margin-bottom:6px"><b dir="auto">${esc(title)}</b>${c.form&&c.form.code?` <span dir="ltr">${esc(c.form.code)}</span>`:''}</div>
    <div style="font-size:12px;color:var(--moss,var(--ink-soft));margin-bottom:10px" dir="auto">${esc(t('fillLocal'))}</div>
    ${!map?`<div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px" dir="auto">${esc(t('fillNoMap'))}</div>`:''}
    ${missing?`<div class="badge due" style="margin-bottom:8px">${esc(t('fillMissing',{n:missing}))}</div>`:''}
    ${rows}`;
  $('#fillModal').dataset.open = '1';
}

function collectFill(){
  const out = {};
  $('#fillBody').querySelectorAll('[data-fill]').forEach(i => { out[i.dataset.fill] = i.value.trim(); });
  return out;
}

$('#fillSaveBtn').addEventListener('click', () => {
  Object.assign(PROFILE.data, collectFill());
  PROFILE.save();
  openFill(fillCaseId);
});

$('#fillPrintBtn').addEventListener('click', () => {
  const c = cases.find(x=>x.id===fillCaseId); if(!c) return;
  Object.assign(PROFILE.data, collectFill());
  PROFILE.save();
  const map = c.form && c.form.code ? FORMS[c.form.code] : null;
  const fields = map ? map.fields : [];
  const title = (c.form && c.form.title_he) || (map && map.he) || caseTitle(c);
  const ag = AGENCIES[c.agency];

  const area = document.getElementById('printArea');
  area.innerHTML = `
    <h1>${esc(title)}</h1>
    <p class="sub">${esc(ag?nameOf(ag):'')}${c.form&&c.form.code?' · '+esc(c.form.code):''}${c.ref?' · '+esc(c.ref):''}</p>
    <table>${fields.map(f=>`
      <tr><th>${esc(f.he)}</th><td dir="${f.direction==='ltr'?'ltr':'auto'}">${esc(PROFILE.data[f.profile_key]||'—')}</td></tr>`).join('')}
    </table>
    <p class="foot">${esc(t('disclaimer'))}</p>`;
  document.body.classList.add('printing');
  window.print();
  setTimeout(()=>document.body.classList.remove('printing'), 500);
});

$('#fillCloseBtn').addEventListener('click', () => { $('#fillModal').dataset.open = '0'; });
$('#fillModal').addEventListener('click', e => { if(e.target.id === 'fillModal') $('#fillModal').dataset.open = '0'; });

/* ======================= BOOT ======================= */
load();
if(AI.load()){
  $('#scanLetter').hidden = false;
  /* health is advisory: if the service says it is not accepting work, the
     action is hidden rather than left to fail on tap */
  AI.checkHealth().then(h => {
    if(h && h.accepts_analysis === false) $('#scanLetter').hidden = true;
  });
}
render();
</script>
